name: Jetson Stack

on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel]
  workflow_dispatch:
    inputs:
      custom_tag:
        description: Optional override for the version tag. Defaults to commit-derived vX.Y.rcN or dev-sha.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-jetson-image
  cancel-in-progress: false

env:
  IMAGE_BASE: jetson_anomaly
  JETSON_HOST: ${{ vars.JETSON_HOST || '100.125.121.125' }}
  JETSON_STACK_DIR: ${{ vars.JETSON_STACK_DIR || '~/jetson-stack' }}
  IMAGE_ARCHIVE: /tmp/jetson_anomaly_image.tar

jobs:
  validate:
    name: Validate Jetson stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Docker Compose config
        run: |
          docker compose -f docker-compose.yaml config >/tmp/jetson-compose.yaml
          docker compose -f docker-compose.yaml -f docker-compose.build.yaml config >/tmp/jetson-compose-build.yaml

      - name: Validate Python syntax
        run: |
          python -m py_compile src/jetson_anomaly_detector/setup.py
          python -m compileall src/jetson_anomaly_detector/jetson_anomaly_detector

      - name: Validate shell scripts
        run: |
          bash -n scripts/start_jetson_anomaly.sh
          bash -n scripts/pull-unprotected.sh

      - name: Validate topic contract
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path("config/anomaly_rosbridge.yaml").read_text(encoding="utf-8")
          env_file = Path("config/containers/jetson_anomaly.env").read_text(encoding="utf-8")
          runtime_files = Path("scripts/runtime-files.txt").read_text(encoding="utf-8")
          client = Path(
              "src/jetson_anomaly_detector/jetson_anomaly_detector/jetson_yolo_rosbridge_client.py"
          ).read_text(encoding="utf-8")
          compose = Path("docker-compose.yaml").read_text(encoding="utf-8")
          build_compose = Path("docker-compose.build.yaml").read_text(encoding="utf-8")
          dockerfile = Path("Dockerfile").read_text(encoding="utf-8")

          assert "/anomaly/events" in config
          assert "/anomaly/markers" in config
          assert "/anomaly/debug_image/compressed" in config
          assert "/anomaly/map_snapshot/compressed" in config
          assert "ROSBRIDGE_URL=ws://raspberry.local:9090" in env_file
          assert "JETSON_LOG_DIR=/workspace/logs" in env_file
          assert "env_file:" in compose
          assert "filebrowser/filebrowser" in compose
          assert "build:" not in compose
          assert "build:" in build_compose
          assert "docker-compose.yaml" in runtime_files
          assert "scripts/pull-unprotected.sh" in runtime_files
          assert "RosbridgeClient" in client
          assert "rclpy" not in client
          assert "CycloneDDS" not in dockerfile
          assert "ros-humble" not in dockerfile
          PY

  build:
    name: Build and Load Jetson image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Free disk for Jetson image build
        run: |
          set -eux
          df -h
          docker builder prune -af || true
          docker system prune -af --volumes || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          df -h

      - name: Read compose image tag
        id: compose
        run: |
          set -e
          IMAGE=$(python - <<'PY'
          from pathlib import Path
          import re

          content = Path("docker-compose.yaml").read_text(encoding="utf-8")
          match = re.search(r"(?m)^\s*image:\s*([^\s#]+)\s*$", content)
          if not match:
              raise SystemExit("docker-compose.yaml must define a direct service image tag")
          image = match.group(1)
          if "${" in image:
              raise SystemExit("docker-compose.yaml image must be a direct tag, not an environment expression")
          print(image)
          PY
          )
          echo "Compose image: $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Prepare metadata
        id: meta
        run: |
          set -e
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE_REPO="${OWNER_LC}/${IMAGE_BASE}"
          echo "image_repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"
          echo "base_name=$IMAGE_BASE" >> "$GITHUB_OUTPUT"

      - name: Determine version tag
        id: version
        env:
          CUSTOM_TAG: ${{ github.event.inputs.custom_tag }}
        run: |
          set -e
          if [ -n "$CUSTOM_TAG" ]; then
            CLEAN="${CUSTOM_TAG//[^[:alnum:]_.-]/-}"
            if ! echo "$CLEAN" | grep -qE '^[a-zA-Z0-9]'; then
              CLEAN="v$CLEAN"
            fi
            echo "Using custom version tag: $CLEAN"
            echo "version_tag=$CLEAN" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MSG=$(git log -1 --pretty=%s || echo '')
          echo "Commit message: $MSG"
          VERSION=$(echo "$MSG" | grep -oE 'v[0-9]+(\.[0-9]+)*\.[Rr][Cc][0-9]+' | tail -n1 | tr '[:upper:]' '[:lower:]' || true)
          if [ -z "$VERSION" ]; then
            echo "No vX(.Y)*.rcN pattern found; falling back to short SHA"
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          CLEAN="${VERSION//[^a-z0-9_.-]/-}"
          if ! echo "$CLEAN" | grep -qE '^[a-z0-9]'; then CLEAN="v$CLEAN"; fi
          echo "Using version tag: $CLEAN"
          echo "version_tag=$CLEAN" >> "$GITHUB_OUTPUT"

      - name: Build PR image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          tags: test/${{ steps.meta.outputs.image_repo }}:pr-${{ steps.meta.outputs.base_name }}-${{ steps.version.outputs.version_tag }}
          cache-from: type=gha,scope=jetson-anomaly
          cache-to: type=gha,scope=jetson-anomaly,mode=max

      - name: Build Docker archive
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          outputs: type=docker,dest=${{ env.IMAGE_ARCHIVE }}
          tags: |
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.base_name }}-${{ steps.version.outputs.version_tag }}
            ${{ steps.compose.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}
          cache-from: type=gha,scope=jetson-anomaly
          cache-to: type=gha,scope=jetson-anomaly,mode=max

      - name: Connect to Tailscale
        if: github.event_name != 'pull_request'
        env:
          TAILSCALE_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -e
          if [ -z "$TAILSCALE_KEY" ]; then
            echo "TAILSCALE_AUTHKEY secret is required to reach Jetson at ${JETSON_HOST}." >&2
            exit 1
          fi
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey "$TAILSCALE_KEY" --hostname "gh-jetson-${GITHUB_RUN_ID}" --accept-routes --ssh --timeout 40s
          sudo tailscale status || true

      - name: Configure SSH
        if: github.event_name != 'pull_request'
        env:
          SSH_USER: ${{ secrets.JETSON_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.JETSON_SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.JETSON_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -e
          if [ -z "$SSH_USER" ]; then
            echo "JETSON_SSH_USER secret is required for docker load on Jetson." >&2
            exit 1
          fi
          mkdir -p ~/.ssh

          if [ -n "$SSH_PRIVATE_KEY_B64" ]; then
            if ! printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 -d > ~/.ssh/jetson_key 2>/tmp/jetson_key_b64.err; then
              if [ -n "$SSH_PRIVATE_KEY" ]; then
                echo "JETSON_SSH_PRIVATE_KEY_B64 is set but is not valid base64; falling back to JETSON_SSH_PRIVATE_KEY." >&2
                printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/jetson_key
              else
                echo "JETSON_SSH_PRIVATE_KEY_B64 is set but is not valid base64, and JETSON_SSH_PRIVATE_KEY is empty." >&2
                cat /tmp/jetson_key_b64.err >&2 || true
                exit 1
              fi
            fi
          elif [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/jetson_key
          else
            echo "Set JETSON_SSH_PRIVATE_KEY_B64 (recommended) or JETSON_SSH_PRIVATE_KEY." >&2
            exit 1
          fi

          chmod 600 ~/.ssh/jetson_key
          if grep -qE '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-)' ~/.ssh/jetson_key; then
            echo "The configured SSH key looks like a PUBLIC key. GitHub secret must contain the PRIVATE key." >&2
            exit 1
          fi
          if ! ssh-keygen -y -f ~/.ssh/jetson_key > ~/.ssh/jetson_key.pub; then
            echo "Invalid SSH private key. Use an unencrypted OpenSSH private key, preferably via JETSON_SSH_PRIVATE_KEY_B64." >&2
            exit 1
          fi
          ssh-keyscan -H "$JETSON_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "ssh_user=$SSH_USER" >> "$GITHUB_ENV"

      - name: Check Jetson SSH connectivity
        if: github.event_name != 'pull_request'
        run: |
          set -e
          ssh -i ~/.ssh/jetson_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${ssh_user}@${JETSON_HOST}" \
            'docker --version && uname -m'

      - name: Prepare Jetson disk for image load
        if: github.event_name != 'pull_request'
        run: |
          set -e
          ssh -i ~/.ssh/jetson_key -o StrictHostKeyChecking=accept-new "${ssh_user}@${JETSON_HOST}" '
            set -e
            mkdir -p "$HOME/jetson-images"
            rm -f "$HOME"/jetson-images/jetson_anomaly-*.tar 2>/dev/null || true
            docker image prune -f || true
            df -h / "$HOME" /var/lib/docker 2>/dev/null || true
          '

      - name: Stream and load image on Jetson
        if: github.event_name != 'pull_request'
        run: |
          set -e
          GENERATED_IMAGE="${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.base_name }}-${{ steps.version.outputs.version_tag }}"
          COMPOSE_IMAGE='${{ steps.compose.outputs.image }}'
          ssh -i ~/.ssh/jetson_key -o StrictHostKeyChecking=accept-new "${ssh_user}@${JETSON_HOST}" \
            'docker load' < "$IMAGE_ARCHIVE"
          ssh -i ~/.ssh/jetson_key -o StrictHostKeyChecking=accept-new "${ssh_user}@${JETSON_HOST}" \
            "docker image inspect '${GENERATED_IMAGE}' >/dev/null && docker image inspect '${COMPOSE_IMAGE}' >/dev/null"

      - name: Update Jetson runtime stack
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN is required to fetch the private repo from Jetson." >&2
            exit 1
          fi
          AUTH_B64=$(python3 - <<'PY'
          import base64
          import os

          token = os.environ["GITHUB_TOKEN"]
          print(base64.b64encode(f"x-access-token:{token}".encode("utf-8")).decode("ascii"))
          PY
          )
          GIT_EXTRAHEADER="AUTHORIZATION: basic ${AUTH_B64}"
          echo "::add-mask::${AUTH_B64}"
          echo "::add-mask::${GIT_EXTRAHEADER}"
          ssh -i ~/.ssh/jetson_key -o StrictHostKeyChecking=accept-new "${ssh_user}@${JETSON_HOST}" \
            "JETSON_STACK_DIR='${JETSON_STACK_DIR}' DEPLOY_BRANCH='${DEPLOY_BRANCH:-devel}' GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' GIT_CONFIG_VALUE_0='${GIT_EXTRAHEADER}' bash -s" <<'REMOTE'
          set -euo pipefail

          stack_dir="${JETSON_STACK_DIR:-~/jetson-stack}"
          case "$stack_dir" in
            "~") stack_dir="$HOME" ;;
            "~/"*) stack_dir="$HOME/${stack_dir#"~/"}" ;;
          esac

          if [ ! -d "$stack_dir/.git" ]; then
            echo "Jetson stack repository not found at: $stack_dir" >&2
            echo "Clone it once on Jetson, or set the GitHub Actions variable JETSON_STACK_DIR." >&2
            exit 1
          fi

          cd "$stack_dir"
          bash scripts/pull-unprotected.sh origin "${DEPLOY_BRANCH:-devel}"
          mkdir -p anomaly_logs logs
          docker compose up -d --remove-orphans
          docker compose ps
          REMOTE

      - name: Cleanup local image archive
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$IMAGE_ARCHIVE"

      - name: Summary
        run: |
          {
            echo '## Jetson Image Build'
            echo "Generated image: ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.base_name }}-${{ steps.version.outputs.version_tag }}"
            echo "Compose image: ${{ steps.compose.outputs.image }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            echo 'PR build only - no Jetson load' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Loaded on Jetson: ${JETSON_HOST}" >> "$GITHUB_STEP_SUMMARY"
            echo "Updated stack dir: ${JETSON_STACK_DIR}" >> "$GITHUB_STEP_SUMMARY"
          fi
