services:
  jetson_anomaly:
    build:
      context: .
      dockerfile: Dockerfile
    image: filipsijak2/jetson_anomaly:jetson_anomaly-dev-local
    container_name: jetson_anomaly_cont
    network_mode: host
    ipc: host
    runtime: nvidia
    gpus: all
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///tmp/cyclonedds.xml}
      ROBOT_TAILSCALE_IP: ${ROBOT_TAILSCALE_IP:-100.102.66.116}
      JETSON_DDS_INTERFACE: ${JETSON_DDS_INTERFACE:-tailscale0}
      JETSON_DDS_PARTICIPANT_INDEX: ${JETSON_DDS_PARTICIPANT_INDEX:-0}
      JETSON_DDS_CLI_PARTICIPANT_INDEX: ${JETSON_DDS_CLI_PARTICIPANT_INDEX:-1}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
    volumes:
      - ./config:/workspace/config:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >
          bash -lc 'source /opt/ros/humble/setup.bash &&
          source /workspace/install/setup.bash &&
          if [ ! -f /tmp/cyclonedds-cli.xml ]; then
          sed "s|<ParticipantIndex>[^<]*</ParticipantIndex>|<ParticipantIndex>${JETSON_DDS_CLI_PARTICIPANT_INDEX:-1}</ParticipantIndex>|"
          /tmp/cyclonedds.xml > /tmp/cyclonedds-cli.xml;
          fi &&
          export CYCLONEDDS_URI=file:///tmp/cyclonedds-cli.xml &&
          ros2 node list 2>/dev/null | grep -Eq "(^|/)jetson_anomaly_detector$"'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped
