services:
  jetson_anomaly:
    image: filipsijak2/jetson_anomaly:jetson_anomaly-dev-local
    container_name: jetson_anomaly_cont
    network_mode: host
    ipc: host
    runtime: nvidia
    gpus: all
    env_file:
      - ./config/containers/jetson_anomaly.env
    volumes:
      - ./config:/workspace/config:ro
      - ./anomaly_logs:/home/jetson/anomaly_logs
      - ./logs:/workspace/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >
          bash -lc 'pgrep -f "[j]etson_anomaly_detector.jetson_yolo_rosbridge_client" >/dev/null'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  # Web file browser for Jetson logs and anomaly evidence.
  # Access at http://<jetson-ip>:8081 by default.
  jetson_log_viewer:
    image: filebrowser/filebrowser:latest
    container_name: jetson_log_viewer_cont
    ports:
      - "${JETSON_LOG_VIEWER_PORT:-8081}:80"
    volumes:
      - ./anomaly_logs:/srv/anomaly_logs:ro
      - ./logs:/srv/logs:ro
    command: ["--root", "/srv", "--port", "80", "--address", "0.0.0.0", "--noauth"]
    restart: unless-stopped
